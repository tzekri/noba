server:
  port: ${PORT:8090}

spring:
  application:
    name: noba-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:noba}?sslmode=prefer
    username: ${DB_USER:noba}
    password: ${DB_PASSWORD:nobapwd}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      # Flux SSE : pas de délai côté Spring MVC, c'est SseEmitter qui gère l'expiration.
      request-timeout: -1

app:
  # Fuseau qui définit « la journée » des tickets (remise à zéro des numéros à minuit).
  timezone: ${APP_TIMEZONE:Africa/Casablanca}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  jwt:
    # À CHANGER en production (32 caractères minimum).
    secret: ${JWT_SECRET:dev-secret-change-me-please-0123456789abcdef}
    validity-hours: ${JWT_VALIDITY_HOURS:12}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:super@noba.io}
    password: ${SUPER_ADMIN_PASSWORD:super1234}
  # Crée une organisation de démonstration au démarrage si la base est vide.
  seed-demo: ${SEED_DEMO:true}
