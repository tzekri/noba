services:
  db:
    image: postgres:16
    container_name: noba-db
    environment:
      POSTGRES_DB: noba
      POSTGRES_USER: noba
      POSTGRES_PASSWORD: nobapwd
    ports:
      - "5433:5432"
    volumes:
      - noba_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noba -d noba"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: noba-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: noba
      DB_USER: noba
      DB_PASSWORD: nobapwd
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      # À CHANGER en production (32 caractères minimum)
      JWT_SECRET: dev-secret-change-me-please-0123456789abcdef
      SUPER_ADMIN_EMAIL: super@noba.io
      SUPER_ADMIN_PASSWORD: super1234
      SEED_DEMO: "true"
    ports:
      - "8090:8090"

volumes:
  noba_db:
